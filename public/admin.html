<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#080808"
  >

  <title>
    Chef Sifat's Kitchen — Admin
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
    }


    button,
    input,
    textarea,
    select {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }


    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow:
        0 15px 50px rgba(0,0,0,.12);
    }


    .login-box h1 {
      margin-top: 0;
    }


    .login-box input {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 9px;
    }


    .login-box button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 9px;
      background: #111;
      color: #fff;
    }


    #app {
      display: none;
      min-height: 100vh;
    }


    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 250px;
      background: #111;
      color: #fff;
      padding: 22px;
      z-index: 100;
    }


    .sidebar h2 {
      margin-top: 0;
    }


    .sidebar button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: #fff;
      padding: 13px;
      margin: 4px 0;
      border-radius: 8px;
    }


    .sidebar button:hover {
      background: #333;
    }


    .sidebar .logout {
      margin-top: 25px;
      background: #a00;
    }


    .admin-main {
      margin-left: 250px;
      padding: 25px;
    }


    .topbar {
      background: #fff;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 20px;
    }


    #view {
      background: #fff;
      padding: 22px;
      border-radius: 14px;
      min-height: 500px;
    }


    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));
      gap: 15px;
    }


    .card {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 12px;
      background: #fff;
    }


    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
    }


    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));
      gap: 10px;
    }


    .form-grid input,
    .form-grid select,
    .form-grid textarea,
    .admin-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }


    .admin-btn {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: #fff;
      margin: 4px;
    }


    .danger {
      background: #a00;
      color: #fff;
    }


    .success {
      background: #16733b;
      color: #fff;
    }


    .table-wrap {
      overflow-x: auto;
    }


    table {
      width: 100%;
      border-collapse: collapse;
    }


    th,
    td {
      border-bottom: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }


    @media(max-width:800px) {

      .sidebar {
        position: relative;
        width: 100%;
        min-height: auto;
      }


      .admin-main {
        margin-left: 0;
        padding: 12px;
      }


      .sidebar button {
        display: inline-block;
        width: auto;
      }

    }

  </style>

</head>


<body>


<!-- =====================================================
     LOGIN
====================================================== -->

<section
  id="login"
  class="login-screen"
>

  <div class="login-box">

    <h1>
      Chef Sifat's Kitchen
    </h1>

    <h3>
      Admin Panel
    </h3>


    <input
      id="adminUsername"
      type="text"
      placeholder="Username"
      autocomplete="username"
    >


    <input
      id="adminPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >


    <button
      type="button"
      onclick="adminLogin()"
    >
      Login
    </button>


    <p id="loginMessage"></p>

  </div>

</section>



<!-- =====================================================
     APP
====================================================== -->

<div id="app">


  <aside class="sidebar">

    <h2>
      CSK Admin
    </h2>


    <button
      type="button"
      onclick="dash()"
    >
      📊 Dashboard
    </button>


    <button
      type="button"
      onclick="orders()"
    >
      📦 Orders
    </button>


    <button
      type="button"
      onclick="menu()"
    >
      🍕 Menu
    </button>


    <button
      type="button"
      onclick="reviews()"
    >
      ⭐ Reviews
    </button>


    <button
      type="button"
      onclick="customers()"
    >
      👥 Customers
    </button>


    <button
      type="button"
      onclick="settings()"
    >
      🚚 Delivery & Settings
    </button>


    <button
      type="button"
      class="logout"
      onclick="adminLogout()"
    >
      🚪 Logout
    </button>

  </aside>



  <main class="admin-main">

    <div class="topbar">

      <strong>
        Chef Sifat's Kitchen — Administration
      </strong>

    </div>


    <div id="view"></div>

  </main>

</div>



<script src="/admin.js"></script>

</body>
</html>
