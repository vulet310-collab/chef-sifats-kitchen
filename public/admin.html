<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#080808"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>CSK Admin — Chef Sifat's Kitchen</title>

  <link
    rel="stylesheet"
    href="/admin.css"
  >

  <style>
    /* =====================================================
       ADMIN PAGE BASE
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #080808;
      color: #f5f5f5;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =====================================================
       LOGIN
       ===================================================== */

    #login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        radial-gradient(
          circle at top,
          rgba(255, 255, 255, .08),
          transparent 45%
        ),
        #080808;
    }

    #login .panel {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      box-shadow:
        0 25px 80px rgba(0,0,0,.5);
    }

    #login h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: -.5px;
    }

    #login .panel::before {
      content:
        "CHEF SIFAT'S KITCHEN";
      display: block;
      margin-bottom: 10px;
      font-size: 11px;
      letter-spacing: 2px;
      opacity: .55;
    }

    #login input {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.15);
      outline: none;
      background: rgba(255,255,255,.06);
      color: #fff;
    }

    #login input:focus {
      border-color: rgba(255,255,255,.45);
    }

    #login button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #080808;
      font-weight: 800;
    }

    #login #e {
      min-height: 20px;
      margin-top: 12px;
      color: #ff7777;
      font-size: 14px;
    }

    /* =====================================================
       APP LAYOUT
       ===================================================== */

    #app {
      min-height: 100vh;
      display: flex;
    }

    #app aside {
      width: 245px;
      flex-shrink: 0;
      min-height: 100vh;
      padding: 24px 16px;
      border-right: 1px solid rgba(255,255,255,.1);
      background: #0d0d0d;
      position: sticky;
      top: 0;
      align-self: flex-start;
    }

    #app aside h2 {
      margin: 0 10px 25px;
      font-size: 20px;
    }

    #app aside h2::after {
      content:
        "ADMIN PANEL";
      display: block;
      margin-top: 5px;
      font-size: 9px;
      letter-spacing: 2px;
      opacity: .45;
    }

    #app aside button {
      width: 100%;
      display: block;
      margin: 5px 0;
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: #ddd;
      text-align: left;
      transition: .2s ease;
    }

    #app aside button:hover {
      background: rgba(255,255,255,.07);
      border-color: rgba(255,255,255,.08);
    }

    #app aside button:last-child {
      margin-top: 25px;
      color: #ff8c8c;
    }

    #app main {
      flex: 1;
      min-width: 0;
      padding: 35px;
    }

    #view {
      width: 100%;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 800px) {

      #app {
        display: block;
      }

      #app aside {
        width: 100%;
        min-height: auto;
        position: relative;
        padding: 15px;
        border-right: 0;
        border-bottom: 1px solid rgba(255,255,255,.1);
      }

      #app aside h2 {
        margin-bottom: 12px;
      }

      #app aside button {
        display: inline-block;
        width: auto;
        margin: 3px;
        padding: 9px 12px;
      }

      #app aside button:last-child {
        margin-top: 3px;
      }

      #app main {
        padding: 18px;
      }
    }
  </style>
</head>


<body>

  <!-- =====================================================
       ADMIN LOGIN
       ===================================================== -->

  <div id="login">

    <div class="panel">

      <h1>CSK Admin</h1>

      <p style="opacity:.65;margin-top:0;">
        Sign in to manage Chef Sifat's Kitchen.
      </p>

      <input
        id="u"
        type="text"
        autocomplete="username"
        placeholder="Admin Username"
      >

      <input
        id="p"
        type="password"
        autocomplete="current-password"
        placeholder="Admin Password"
      >

      <button
        type="button"
        onclick="login()"
      >
        Sign In
      </button>

      <p id="e"></p>

    </div>

  </div>


  <!-- =====================================================
       ADMIN APPLICATION
       ===================================================== -->

  <div id="app" style="display:none;">

    <!-- ===================================================
         SIDEBAR
         =================================================== -->

    <aside>

      <h2>
        Chef Sifat's Kitchen
      </h2>


      <button
        type="button"
        onclick="dash()"
      >
        🏠 Dashboard
      </button>


      <button
        type="button"
        onclick="orders()"
      >
        📦 Orders
      </button>


      <button
        type="button"
        onclick="menu()"
      >
        🍕 Menu
      </button>


      <button
        type="button"
        onclick="reviews()"
      >
        ⭐ Reviews
      </button>


      <button
        type="button"
        onclick="customers()"
      >
        👥 Customers
      </button>


      <button
        type="button"
        onclick="settings()"
      >
        ⚙️ Delivery & Settings
      </button>


      <button
        type="button"
        onclick="logout()"
      >
        🚪 Logout
      </button>

    </aside>


    <!-- ===================================================
         MAIN CONTENT
         =================================================== -->

    <main>

      <div id="view"></div>

    </main>

  </div>


  <!-- =====================================================
       ADMIN JAVASCRIPT
       ===================================================== -->

  <script src="/admin.js"></script>

</body>

</html>
