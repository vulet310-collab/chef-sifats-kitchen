<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chef Sifat's Kitchen — Admin</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:'DM Sans',sans-serif}.wrap{max-width:1100px;margin:auto;padding:35px 20px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #30271a;padding-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.brand img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:1px solid #e8a323}.brand h1{font-family:'Playfair Display';font-size:24px;margin:0}.brand small{color:#e8a323}.card{background:#121212;border:1px solid #332a1d;border-radius:18px;padding:22px;margin-top:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;color:#bbb;font-size:12px}input,select,textarea{background:#0b0b0b;border:1px solid #3a3123;color:#fff;border-radius:9px;padding:11px;width:100%}textarea{min-height:70px}.full{grid-column:1/-1}.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer;background:#e8a323;color:#111}.btn.secondary{background:#211a0d;color:#e8a323;border:1px solid #624b1d}.items{display:grid;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:15px;background:#0d0d0d;border:1px solid #29241d;border-radius:12px;padding:12px}.item img{width:60px;height:60px;object-fit:cover;border-radius:8px}.meta{flex:1}.meta b{display:block}.meta small{color:#777}.actions{display:flex;gap:7px}.actions button{background:#211a0d;color:#e8a323;border:1px solid #4d3b1e;border-radius:8px;padding:7px;cursor:pointer}.danger{color:#ff8d78!important;border-color:#653025!important}.note{color:#888;font-size:12px;line-height:1.6}.hidden{display:none}.login{max-width:420px;margin:10vh auto}.login h1{font-family:'Playfair Display';font-size:34px}.status{margin-top:10px;color:#e8a323;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column}.item{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
</style></head><body><div id="login" class="wrap login"><div class="card"><h1>Admin Panel</h1><p class="note">Chef Sifat's Kitchen menu manager. This local version saves changes in this browser.</p><label>Admin password<input id="pw" type="password" placeholder="Enter password"></label><br><button class="btn" onclick="login()">Login</button><div id="loginMsg" class="status"></div></div></div>
<div id="app" class="wrap hidden"><div class="head"><div class="brand"><img src="assets/logo.jpg"><div><h1>Chef Sifat's Kitchen</h1><small>MENU ADMIN</small></div></div><div><button class="btn secondary" onclick="location.href='index.html'">View Website</button> <button class="btn" onclick="logout()">Logout</button></div></div>
<div class="card"><h2>Add / Edit Food Item</h2><div class="grid"><label>Food name<input id="name"></label><label>Category<select id="cat"><option value="pizza">Pizza</option><option value="momo">Momo</option><option value="continental">Continental</option><option value="kacchi">Kacchi Biryani</option></select></label><label>Price options <small>Example: 6″=300, 8″=380 OR 1 person=399</small><input id="prices" placeholder="6″=300, 8″=380"></label><label>Image file<input id="image" type="file" accept="image/*"></label><label>Existing image path<input id="imagePath" placeholder="assets/my-photo.jpg"></label><label>Minimum quantity<input id="minQty" type="number" min="1" value="1"></label><label>Maximum quantity<input id="maxQty" type="number" min="1" value="99"></label><label class="full">Short note<textarea id="note"></textarea></label><div class="full"><button class="btn" onclick="saveItem()">Save Item</button> <button class="btn secondary" onclick="clearForm()">Clear</button><span id="status" class="status"></span></div></div></div>
<div class="card"><h2>Current Menu</h2><p class="note">Tip: Replace a food image by editing the item and uploading a new photo. New items appear on the main website in this browser.</p><div id="items" class="items"></div></div></div>
<script>const PASS='chefadmin2026';let menu=JSON.parse(localStorage.getItem('chefSifatMenu')||'null');let editing=-1;const $=id=>document.getElementById(id);function login(){if($('pw').value===PASS){sessionStorage.admin='1';show()}else $('loginMsg').textContent='Incorrect password.'}function show(){if(sessionStorage.admin==='1'){$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}}function logout(){sessionStorage.removeItem('admin');location.reload()}function render(){menu=JSON.parse(localStorage.getItem('chefSifatMenu')||'[]');$('items').innerHTML=menu.map((x,i)=>`<div class="item"><img src="${x.image}" onerror="this.style.opacity=.25"><div class="meta"><b>${x.name}</b><small>${x.cat} • ${Object.entries(x.prices).map(([k,v])=>k+': ৳'+v).join(' | ')}</small></div><div class="actions"><button onclick="editItem(${i})">Edit</button><button class="danger" onclick="deleteItem(${i})">Delete</button></div></div>`).join('')||'<p class="note">No items.</p>'}function clearForm(){editing=-1;['name','prices','imagePath','note'].forEach(id=>$(id).value='');$('minQty').value=1;$('maxQty').value=99;$('image').value=''}function editItem(i){const x=menu[i];editing=i;$('name').value=x.name;$('cat').value=x.cat;$('prices').value=Object.entries(x.prices).map(([k,v])=>`${k}=${v}`).join(', ');$('imagePath').value=x.image;$('minQty').value=x.minQty||1;$('maxQty').value=x.maxQty||99;$('note').value=x.note||'';scrollTo({top:0,behavior:'smooth'})}function deleteItem(i){if(!confirm('Delete '+menu[i].name+'?'))return;menu.splice(i,1);localStorage.setItem('chefSifatMenu',JSON.stringify(menu));render()}function parsePrices(s){const o={};s.split(',').map(x=>x.trim()).filter(Boolean).forEach(part=>{const m=part.split('=');if(m.length>=2)o[m[0].trim()]=Number(m.slice(1).join('=').replace(/[^0-9.]/g,''));});return o}function saveItem(){const name=$('name').value.trim(),prices=parsePrices($('prices').value);if(!name||!Object.keys(prices).length){$('status').textContent='Enter a food name and at least one price.';return}const save=(image)=>{const x={name,cat:$('cat').value,prices,image:image||$('imagePath').value.trim()||'assets/pizza-hero.png',minQty:Number($('minQty').value)||1,maxQty:Number($('maxQty').value)||99,note:$('note').value.trim()};if(editing>=0)menu[editing]=x;else menu.push(x);localStorage.setItem('chefSifatMenu',JSON.stringify(menu));$('status').textContent='Saved ✓';clearForm();render()};const f=$('image').files[0];if(f){const r=new FileReader();r.onload=()=>save(r.result);r.readAsDataURL(f)}else save()}show();</script></body></html>
